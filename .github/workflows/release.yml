name: Windows release

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned build dependencies
        run: python -m pip install PyQt6==6.10.1 PyQt6-sip==13.10.3 PyQt6-Qt6==6.10.1 pywin32==311 tzdata==2025.2 PyInstaller==6.18.0 pyinstaller-hooks-contrib==2026.0

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      - name: Build executable
        run: python scripts/build_windows.py

      - name: Packaged self-test
        run: python scripts/verify_packaged.py dist/OutlookMaximizer.exe

      - name: Decide release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = "v" + (python -c "import outlook_maximizer; print(outlook_maximizer.__version__)") }
          gh release view $tag 2>$null | Out-Null
          $publish = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag publish=$publish"
          exit 0  # "release not found" is the expected answer, not a failure

      - name: Collect release assets
        shell: pwsh
        run: |
          git archive --format=zip --output dist/OutlookMaximizer-source.zip HEAD
          Compress-Archive -Path third_party_licenses/*, LICENSE, THIRD_PARTY_NOTICES.md -DestinationPath dist/OutlookMaximizer-licenses.zip
          Get-FileHash dist/*.exe, dist/*.zip -Algorithm SHA256 | ForEach-Object { "- ``$(Split-Path $_.Path -Leaf)``: ``$($_.Hash.ToLower())``" } | Out-File dist/checksums.md -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookMaximizer
          path: dist/*

      - name: Publish GitHub release
        if: steps.tag.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Download **OutlookMaximizer.exe** from Assets and double-click it on Windows x64 (unsigned).

          從 Assets 下載 **OutlookMaximizer.exe**，在 Windows x64 雙擊即可啟動（未數位簽章）。

          ## Reply direction / 回覆方向
          - Select Reply, enter or paste your direction, then Submit to generate a draft. / 點「回覆」後，在「想要怎麼回覆？」輸入或貼上方向，按「送出」才開始草擬。
          - Your direction takes priority over About me and default reply style for Codex, Antigravity, and Claude. / 三個 AI 平台皆以本次方向優先，About me 作為補充。
          - Cancel does not generate a draft; changing mail closes the input window. / 取消不會草擬，切換信件會關閉輸入視窗。
          - Use Change reply direction to regenerate. Automatic replies, if enabled, retain their existing behavior. / 可按「修改回覆方向」重新草擬；自行啟用的自動回覆維持原行為。

          ## Quick test / 快速測試
          Select an email in classic Outlook, click Reply, paste a direction such as "Politely decline and suggest next Tuesday", and Submit. Check that the draft follows it. Cancel and switching emails must not submit the input. / 在傳統 Outlook 選信，點「回覆」，貼上「婉拒邀請並提議下週二」後送出，確認草稿符合方向；取消或切換信件不應送出方向。

          Built by GitHub Actions from commit ``$env:GITHUB_SHA``.

          ## Checksums / SHA-256
          $(Get-Content dist/checksums.md -Raw)
          "@
          $tag = "${{ steps.tag.outputs.tag }}"
          $releaseOptions = @()
          if ($tag -match '-(rc|alpha|beta)[.-]') { $releaseOptions += '--prerelease' }
          gh release create $tag dist/OutlookMaximizer.exe dist/OutlookMaximizer-source.zip dist/OutlookMaximizer-licenses.zip --target $env:GITHUB_SHA --title "Outlook Maximizer $tag" --notes $notes @releaseOptions
