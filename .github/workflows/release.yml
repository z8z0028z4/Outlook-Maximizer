name: Windows release

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned build dependencies
        run: python -m pip install PyQt6==6.10.1 PyQt6-sip==13.10.3 PyQt6-Qt6==6.10.1 pywin32==311 tzdata==2025.2 PyInstaller==6.18.0 pyinstaller-hooks-contrib==2026.0

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      - name: Build executable
        run: python scripts/build_windows.py

      - name: Packaged self-test
        run: python scripts/verify_packaged.py dist/OutlookMaximizer.exe

      - name: Decide release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
          else { $tag = "v" + (python -c "import outlook_maximizer; print(outlook_maximizer.__version__)") }
          gh release view $tag 2>$null | Out-Null
          $publish = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag publish=$publish"
          exit 0  # "release not found" is the expected answer, not a failure

      - name: Collect release assets
        shell: pwsh
        run: |
          git archive --format=zip --output dist/OutlookMaximizer-source.zip HEAD
          Compress-Archive -Path third_party_licenses/*, LICENSE, THIRD_PARTY_NOTICES.md -DestinationPath dist/OutlookMaximizer-licenses.zip
          Get-FileHash dist/*.exe, dist/*.zip -Algorithm SHA256 | ForEach-Object { "- ``$(Split-Path $_.Path -Leaf)``: ``$($_.Hash.ToLower())``" } | Out-File dist/checksums.md -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookMaximizer
          path: dist/*

      - name: Publish GitHub release
        if: steps.tag.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Download **OutlookMaximizer.exe** from Assets and double-click it on Windows x64 (unsigned).

          從 Assets 下載 **OutlookMaximizer.exe**，在 Windows x64 雙擊即可啟動（未數位簽章）。

          ## Calendar dates and AGY effort / 行程日期與 AGY 思考強度
          - Clarify year inference for month/day dates and combine introductory dates with itinerary times. / 補強省略年份的月日判斷，合併前言日期與下方議程時間。
          - Preserve a known start or end time in the event editor when the other is missing. / 行程起訖缺一端時，確認視窗仍保留已知日期與時間。
          - Use Outlook's native delivery timestamp as a fallback when ReceivedTime is unavailable. / 收信時間讀取失敗時，以 Outlook 原生投遞時間作備援。
          - Disable the AGY effort selector and align it with the selected model, including stale saved settings. / AGY effort 欄位反灰並隨模型自動對齊，同時修正舊設定不匹配的情況。

          ## Quick test / 快速測試
          Exit the previous app before starting this build. Regenerate the visit email summary and check the December 1, 2026 date and known start time. Switch AGY medium/high variants and verify the disabled effort field follows the model. / 請先結束舊版再啟動；重新產生參訪信摘要，確認 2026/12/1 與已知開始時間。切換 AGY medium/high 模型，確認 effort 反灰且同步。

          This is a prerelease for testing. Original-email inference still needs validation with a real Outlook/AI account; unknown end times require confirmation. / 此為測試版，原信的日期推理仍需在實際 Outlook 與 AI 帳號重測；未知結束時間仍須確認。

          Built by GitHub Actions from commit ``$env:GITHUB_SHA``.

          ## Checksums / SHA-256
          $(Get-Content dist/checksums.md -Raw)
          "@
          $tag = "${{ steps.tag.outputs.tag }}"
          $releaseOptions = @()
          if ($tag -match '-(rc|alpha|beta)[.-]') { $releaseOptions += '--prerelease' }
          gh release create $tag dist/OutlookMaximizer.exe dist/OutlookMaximizer-source.zip dist/OutlookMaximizer-licenses.zip --target $env:GITHUB_SHA --title "Outlook Maximizer $tag" --notes $notes @releaseOptions
